name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright pyinstaller
          python -m playwright install chromium

      - name: Build executable
        run: python build.py

      - name: Bundle as .app
        run: |
          APP="dist/JH Assistant.app"
          mkdir -p "$APP/Contents/MacOS"
          cp dist/jh_assistant "$APP/Contents/MacOS/jh_assistant"
          cat > "$APP/Contents/Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>jh_assistant</string>
            <key>CFBundleIdentifier</key><string>com.jobhunt.assistant</string>
            <key>CFBundleName</key><string>JH Assistant</string>
            <key>CFBundleVersion</key><string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key><string>${{ github.ref_name }}</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          EOF

      - name: Zip .app
        run: |
          cd dist && zip -r jh-assistant-macos.zip "JH Assistant.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jh-assistant-macos
          path: dist/jh-assistant-macos.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/jh-assistant-macos.zip
