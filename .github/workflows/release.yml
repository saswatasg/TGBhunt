name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install playwright pyinstaller
          python -m playwright install chromium

      - name: Build executable
        run: python build.py

      - name: Bundle as .app
        run: |
          export APP="dist/TGB Hunt.app"
          mkdir -p "$APP/Contents/MacOS"
          cp dist/tgb_hunt "$APP/Contents/MacOS/tgb_hunt"
          chmod +x "$APP/Contents/MacOS/tgb_hunt"
          python3 -c "
          import os, plistlib
          ref = os.environ['GITHUB_REF_NAME']
          app = os.environ['APP']
          plistlib.dump({
              'CFBundleExecutable': 'tgb_hunt',
              'CFBundleIdentifier': 'com.tgbhunt.app',
              'CFBundleInfoDictionaryVersion': '6.0',
              'CFBundleName': 'TGB Hunt',
              'CFBundlePackageType': 'APPL',
              'CFBundleShortVersionString': ref,
              'CFBundleVersion': ref,
              'NSHighResolutionCapable': True,
          }, open(os.path.join(app, 'Contents', 'Info.plist'), 'wb'))
          "
          codesign --force --deep --sign - "$APP"

      - name: Zip .app
        run: |
          cd dist && zip -r tgb-hunt-macos.zip "TGB Hunt.app"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tgb-hunt-macos
          path: dist/tgb-hunt-macos.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/tgb-hunt-macos.zip
