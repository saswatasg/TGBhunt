# local.yml — Docker Compose
# Two services:
#   app:   LinkedIn automation daemon + VNC (:6080)
#   admin: Django admin + dashboard (:8000)

services:
  app:
    build:
      context: .
      dockerfile: ./compose/linkedin/Dockerfile
      args:
        - BUILD_ENV=local
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      - ENABLE_VNC=true
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    volumes:
      - .:/app
    ports:
      - "6080:6080"

  admin:
    build:
      context: .
      dockerfile: ./compose/linkedin/Dockerfile
      args:
        - BUILD_ENV=local
    restart: unless-stopped
    environment:
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      - DJANGO_SETTINGS_MODULE=linkedin.django_settings
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    entrypoint:
      - /usr/sbin/gosu
      - ubuntu
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000
